<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamin Le Bech</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 font-sans pb-20 select-none">

  <!-- Splash Screen -->
  <div id="splash-screen" class="fixed inset-0 bg-emerald-700 z-50 flex flex-col items-center justify-center text-white transition-opacity duration-300">
    <div class="text-center space-y-4">
      <div class="w-20 h-20 bg-white/10 rounded-full flex items-center justify-center mx-auto shadow-inner">
        <i class="fa-solid fa-mountain-city text-4xl text-white"></i>
      </div>
      <h1 class="text-3xl font-extrabold tracking-wide">Jamin Le Bech</h1>
      <p class="text-sm text-emerald-100">Your Land, Right Value</p>
      
      <div class="w-48 bg-emerald-900/50 rounded-full h-1.5 mx-auto overflow-hidden mt-6">
        <div id="splash-progress" class="bg-white h-full w-0 transition-all duration-75"></div>
      </div>
    </div>
  </div>

  <!-- SIDEBAR MENU OVERLAY -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity"></div>

  <!-- SIDEBAR MENU DRAWER -->
  <aside id="sidebar-menu" class="fixed top-0 left-0 w-64 h-full bg-white z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col">
    <div class="bg-emerald-600 text-white p-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-circle-user text-4xl"></i>
        <div>
          <h3 id="sidebar-user-name" class="font-bold text-sm">User</h3>
          <p id="sidebar-user-phone" class="text-xs opacity-80">+91 Phone</p>
        </div>
      </div>
      <button id="close-sidebar-btn" class="text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <nav class="flex-1 p-4 space-y-2 text-gray-700 font-medium text-sm">
      <button id="menu-home" class="w-full flex items-center gap-3 p-2.5 rounded-lg hover:bg-emerald-50 hover:text-emerald-600 transition">
        <i class="fa-solid fa-house w-5"></i> Home
      </button>
      <button id="menu-terms" class="w-full flex items-center gap-3 p-2.5 rounded-lg hover:bg-emerald-50 hover:text-emerald-600 transition">
        <i class="fa-solid fa-file-contract w-5"></i> Terms & Conditions
      </button>
      <button id="menu-privacy" class="w-full flex items-center gap-3 p-2.5 rounded-lg hover:bg-emerald-50 hover:text-emerald-600 transition">
        <i class="fa-solid fa-shield-halved w-5"></i> Privacy Policy
      </button>
      <button id="menu-share" class="w-full flex items-center gap-3 p-2.5 rounded-lg hover:bg-emerald-50 hover:text-emerald-600 transition">
        <i class="fa-solid fa-share-nodes w-5"></i> Share App
      </button>
    </nav>

    <div class="p-4 border-t text-center text-xs text-gray-400">
      App Version 2.0
    </div>
  </aside>

  <!-- App Header -->
  <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center">
    <button id="open-sidebar-btn" class="text-xl p-1">
      <i class="fa-solid fa-bars"></i>
    </button>
    <h1 class="text-xl font-bold flex items-center gap-2">
      <i class="fa-solid fa-mountain-city"></i> Jamin Le Bech
    </h1>
    <button id="app-refresh-btn" class="text-xl p-1 hover:rotate-180 transition-transform duration-500">
      <i class="fa-solid fa-rotate-right"></i>
    </button>
  </header>

  <!-- Main Container -->
  <main class="p-4 max-w-md mx-auto">

    <!-- Auth Section (Mandatory Login Screen) -->
    <section id="auth-section" class="bg-white p-6 rounded-xl shadow-md space-y-4 text-center mt-10">
      <h2 class="text-2xl font-bold text-gray-800">Login / Sign In</h2>
      <p class="text-xs text-gray-500">Enter mobile number to verify</p>
      
      <div id="phone-input-group" class="space-y-3">
        <div class="flex items-center border rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-emerald-500">
          <span class="bg-gray-100 px-3 py-2 text-gray-600 font-semibold">+91</span>
          <input type="tel" id="phone-number" placeholder="Enter test number" class="w-full p-2 outline-none" maxlength="10">
        </div>
        <div id="recaptcha-container"></div>
        <button id="send-otp-btn" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition">
          Send OTP
        </button>
      </div>

      <div id="otp-input-group" class="hidden space-y-3">
        <input type="number" id="otp-code" placeholder="Enter Test OTP" class="w-full p-2.5 border rounded-lg text-center tracking-widest text-lg outline-none focus:ring-2 focus:ring-emerald-500">
        <button id="verify-otp-btn" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition">
          Verify & Login
        </button>
      </div>
    </section>

    <!-- HOME SECTION -->
    <section id="home-section" class="hidden space-y-3">
      
      <!-- Search Bar -->
      <div class="relative flex items-center">
        <i class="fa-solid fa-magnifying-glass absolute left-3 text-gray-400 text-sm"></i>
        <input type="text" id="search-location" placeholder="Search location or title..." class="w-full pl-9 pr-10 py-2.5 bg-white border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm">
        <button id="toggle-filter-btn" class="absolute right-2 p-1.5 bg-emerald-50 text-emerald-600 rounded-lg text-xs font-semibold">
          <i class="fa-solid fa-sliders"></i>
        </button>
      </div>

      <!-- GPS 50 KM & Map Filter Buttons -->
      <div class="grid grid-cols-2 gap-2">
        <button id="geo-radius-btn" class="flex items-center justify-center gap-1.5 bg-emerald-50 border border-emerald-200 text-emerald-800 p-2.5 rounded-xl text-xs font-bold hover:bg-emerald-100">
          <i class="fa-solid fa-location-crosshairs text-emerald-600"></i>
          <span>GPS 50KM Search</span>
        </button>
        <button id="open-map-picker-btn" class="flex items-center justify-center gap-1.5 bg-blue-50 border border-blue-200 text-blue-800 p-2.5 rounded-xl text-xs font-bold hover:bg-blue-100">
          <i class="fa-solid fa-map-location-dot text-blue-600"></i>
          <span>Select on Map</span>
        </button>
      </div>

      <!-- Active Location Status -->
      <div id="active-geo-status" class="hidden flex items-center justify-between bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs">
        <span id="geo-status-text"><i class="fa-solid fa-circle-check"></i> 50 KM Filter Active</span>
        <button id="clear-geo-btn" class="underline font-semibold text-[10px]">Clear Map Filter</button>
      </div>

      <!-- Advanced Filter Drawer -->
      <div id="filter-drawer" class="hidden bg-white p-3.5 rounded-xl shadow-sm border space-y-3">
        <div class="flex justify-between items-center text-xs font-bold text-gray-700 border-b pb-2">
          <span>Filters</span>
          <button id="clear-filter-btn" class="text-red-500 font-semibold hover:underline"><i class="fa-solid fa-rotate-left"></i> Reset</button>
        </div>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-gray-500">Max Price (₹)</label>
            <input type="number" id="filter-max-price" placeholder="e.g. 5000000" class="w-full p-2 border rounded text-xs outline-none">
          </div>
        </div>

        <button id="apply-filter-btn" class="w-full bg-emerald-600 text-white py-1.5 rounded-lg text-xs font-semibold">
          Apply Filter
        </button>
      </div>

      <!-- Land Posts List Container -->
      <div id="posts-container" class="space-y-3"></div>
    </section>

    <!-- Post Detail Section -->
    <section id="post-detail-section" class="hidden bg-white p-4 rounded-xl shadow-md space-y-4">
      <button id="back-to-home-btn" class="text-xs text-emerald-600 font-bold flex items-center gap-1">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>
      <div id="post-detail-content"></div>
    </section>

    <!-- Add Post Section -->
    <section id="add-post-section" class="hidden bg-white p-4 rounded-xl shadow-md space-y-3">
      <h2 class="text-lg font-bold text-gray-800">Post New Listing</h2>
      <form id="add-post-form" class="space-y-3">
        <input type="text" id="post-subject" placeholder="Title (e.g. 5 Vigha Land)" required class="w-full p-2 border rounded text-sm outline-none">
        <input type="number" id="post-price" placeholder="Price ₹" required class="w-full p-2 border rounded text-sm outline-none">
        <input type="text" id="post-size" placeholder="Area Size (e.g. 2 Vigha)" required class="w-full p-2 border rounded text-sm outline-none">
        <input type="text" id="post-location" placeholder="Location / Village" required class="w-full p-2 border rounded text-sm outline-none">
        
        <button type="button" id="fetch-post-coords-btn" class="w-full bg-emerald-50 text-emerald-700 border border-emerald-300 py-2 rounded text-xs font-semibold flex justify-center items-center gap-2">
          <i class="fa-solid fa-location-dot"></i> Get Current GPS Location
        </button>
        <p id="coords-status" class="text-[11px] text-emerald-600 font-semibold text-center"></p>

        <textarea id="post-description" placeholder="Land details..." required class="w-full p-2 border rounded text-sm outline-none h-20"></textarea>
        <button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-700">
          Post Listing
        </button>
      </form>
    </section>

    <!-- Account Section -->
    <section id="account-section" class="hidden bg-white p-6 rounded-xl shadow-md space-y-4 text-center">
      <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto text-emerald-700 text-3xl font-bold">
        <i class="fa-solid fa-user"></i>
      </div>
      <div>
        <h3 id="acc-name" class="text-xl font-bold text-gray-800">User Profile</h3>
        <p id="acc-phone" class="text-xs text-gray-500">+91 Mobile Number</p>
      </div>
      <button id="logout-btn" class="w-full bg-red-500 text-white py-2 rounded-lg font-semibold text-sm hover:bg-red-600">
        Logout
      </button>
    </section>

  </main>

  <!-- MAP SELECTOR MODAL -->
  <div id="map-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-xl overflow-hidden shadow-2xl flex flex-col h-[80vh]">
      <div class="bg-emerald-600 text-white p-3 font-bold text-sm flex justify-between items-center">
        <span>Click on Map to Select Center Location</span>
        <button id="close-map-btn" class="text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="leaflet-map" class="flex-1 w-full"></div>
      <div class="p-3 bg-gray-50 flex justify-between items-center border-t">
        <span id="selected-map-coords" class="text-xs text-gray-600 font-mono">Select location on map</span>
        <button id="confirm-map-loc-btn" class="bg-emerald-600 text-white px-4 py-1.5 rounded text-xs font-bold">Apply 50KM Search</button>
      </div>
    </div>
  </div>

  <!-- FLOATING BOTTOM NAVIGATION (Only active when Logged In) -->
  <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center px-2 py-1.5 z-40 shadow-lg">
    <button id="nav-home" class="flex flex-col items-center justify-center text-emerald-600 w-16 py-1">
      <i class="fa-solid fa-house text-xl mb-0.5"></i>
      <span class="text-[11px] font-medium">Home</span>
    </button>
    <button id="nav-add" class="flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600 w-16 py-1">
      <i class="fa-solid fa-plus-circle text-xl mb-0.5"></i>
      <span class="text-[11px] font-medium">Post Ad</span>
    </button>
    <button id="nav-account" class="flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600 w-16 py-1">
      <i class="fa-solid fa-user text-xl mb-0.5"></i>
      <span class="text-[11px] font-medium">Account</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
